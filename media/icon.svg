<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2a2045"/>
      <stop offset="1" stop-color="#0c0a14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dc8a"/>
      <stop offset="1" stop-color="#b98a2e"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="384" height="384" rx="56" fill="url(#bg)" stroke="url(#gold)" stroke-width="10"/>

  <!-- eye -->
  <g fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 160 Q200 50 330 160 Q200 270 70 160 Z"/>
  </g>
  <circle cx="200" cy="160" r="40" fill="url(#gold)"/>
  <circle cx="200" cy="160" r="16" fill="#0c0a14"/>

  <!-- slash -->
  <line x1="95" y1="265" x2="305" y2="55" stroke="#0c0a14" stroke-width="40" stroke-linecap="round"/>
  <line x1="95" y1="265" x2="305" y2="55" stroke="#e0433a" stroke-width="22" stroke-linecap="round"/>

  <!-- label -->
  <text x="200" y="358" text-anchor="middle" font-family="Arial Black, Segoe UI Black, Arial, sans-serif"
        font-weight="900" font-size="88" letter-spacing="4" fill="url(#gold)"
        stroke="#0c0a14" stroke-width="3" paint-order="stroke">MMR</text>
</svg>
